      ppo:
        net_arch: [512, 512]
        learning_rate: 3.0e-4
        gamma: 0.98
        gae_lambda: 0.95
        rollout_steps: 1024
        epochs: 20
        ent_coef: 0.02

  fetch_push:
    benchmark: manipulation
