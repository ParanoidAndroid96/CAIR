# CAIR experiment configuration.
# Method settings are shared unless explicitly overridden by a task/pairing.

cair:
  cagrad_c: 0.7
  lambda_lr: 1.0e-4
  beta: 0.9
  mu_init: 1.0
  mu_lr: 1.0
  lambda_floor: 0.05
  warmup_episodes: 40
  cagrad_steps: 20
  cagrad_lr: 2.0
  cagrad_momentum: 0.5

benchmark_defaults:
  manipulation:
    sync_interval: 10
    seeds: 5
  locomotion:
    sync_interval: 5
    seeds: 10

pairings:
  - bc+sac
  - bc+ddpg
  - bc+ppo
  - dagger+sac
  - dagger+ddpg
  - dagger+ppo

tasks:
  fetch_pick_and_place:
    benchmark: manipulation
    paper_env_id: FetchPickAndPlace-v1
    episode_length: 1000
    train_steps: 10000000
    demonstrations:
      kind: fetch_rule_based
      trajectories: 50
      controller: pick_and_place
    rl:
      sac:
        net_arch: [512, 512]
        learning_rate: 3.0e-4
        gamma: 0.98
        batch_size: 128
        ent_coef: auto
        tau: 0.02
      ddpg:
        net_arch: [512, 512]
        learning_rate: 3.0e-4
        gamma: 0.98
        batch_size: 128
        action_noise_sigma: 0.15
        tau: 0.02
      ppo:
        net_arch: [512, 512]
        learning_rate: 3.0e-4
        gamma: 0.98
        gae_lambda: 0.95
        rollout_steps: 1024
        epochs: 30
        ent_coef: 0.2

  fetch_slide:
    benchmark: manipulation
    paper_env_id: FetchSlide-v1
    episode_length: 1000
    train_steps: 10000000
    demonstrations:
      kind: fetch_rule_based
      trajectories: 50
      controller: slide
    rl:
      sac:
        net_arch: [512, 512]
        learning_rate: 3.0e-4
        gamma: 0.98
        batch_size: 128
